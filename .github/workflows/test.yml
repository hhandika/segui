name: test

on: push

jobs:
  check:
    name: Test
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
      - name: Check sources
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17.x"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.2"
      - run: |
          flutter pub get
          flutter analyze

      # The native assets build hook compiles the Rust crate for tests and builds.
      - name: Setup Rust from rust/rust-toolchain.toml
        working-directory: rust
        run: rustup toolchain install

      - name: Run test
        run: flutter test

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Linux with the native Rust library
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build Windows with the native Rust library
        if: runner.os == 'Windows'
        run: flutter build windows --release
