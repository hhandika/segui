<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296"><title id="alignment-filtering-title">Alignment filtering</title><desc id="alignment-filtering-desc">With a minimum length of 500 bp, locus_1 (1240 bp) is kept, locus_2 (380 bp) is removed, locus_3 (860 bp) is kept, locus_4 (450 bp) is removed, locus_5 (1020 bp) is kept. Other criteria are matrix completeness, parsimony-informative sites, missing data, minimum taxa, and taxon ID.</desc><text x="0" y="18" font-family="sans-serif" font-size="15" fill="#010203" font-weight="700">Example: minimum alignment length 500 bp</text><g><text x="72" y="53" text-anchor="end" font-family="monospace" font-size="12" fill="#010203" dy="4.2">locus_1</text><rect x="80" y="44" width="324.3076923076923" height="18" rx="4" fill="#009245" /><text x="412.3076923076923" y="53" font-family="sans-serif" font-size="12" fill="#040506" dy="4.2">1240 bp</text><text x="560" y="53" font-family="sans-serif" font-size="12" fill="#070809" font-weight="700" dy="4.2">✓ kept</text></g><g><text x="72" y="83" text-anchor="end" font-family="monospace" font-size="12" fill="#010203" dy="4.2">locus_2</text><rect x="80" y="74" width="99.38461538461539" height="18" rx="4" opacity="0.35" fill="#6b7280" /><text x="187.3846153846154" y="83" font-family="sans-serif" font-size="12" fill="#040506" dy="4.2">380 bp</text><text x="560" y="83" font-family="sans-serif" font-size="12" fill="#d9534f" font-weight="700" dy="4.2">✕ removed</text></g><g><text x="72" y="113" text-anchor="end" font-family="monospace" font-size="12" fill="#010203" dy="4.2">locus_3</text><rect x="80" y="104" width="224.92307692307693" height="18" rx="4" fill="#009245" /><text x="312.9230769230769" y="113" font-family="sans-serif" font-size="12" fill="#040506" dy="4.2">860 bp</text><text x="560" y="113" font-family="sans-serif" font-size="12" fill="#070809" font-weight="700" dy="4.2">✓ kept</text></g><g><text x="72" y="143" text-anchor="end" font-family="monospace" font-size="12" fill="#010203" dy="4.2">locus_4</text><rect x="80" y="134" width="117.6923076923077" height="18" rx="4" opacity="0.35" fill="#6b7280" /><text x="205.69230769230768" y="143" font-family="sans-serif" font-size="12" fill="#040506" dy="4.2">450 bp</text><text x="560" y="143" font-family="sans-serif" font-size="12" fill="#d9534f" font-weight="700" dy="4.2">✕ removed</text></g><g><text x="72" y="173" text-anchor="end" font-family="monospace" font-size="12" fill="#010203" dy="4.2">locus_5</text><rect x="80" y="164" width="266.7692307692308" height="18" rx="4" fill="#009245" /><text x="354.7692307692308" y="173" font-family="sans-serif" font-size="12" fill="#040506" dy="4.2">1020 bp</text><text x="560" y="173" font-family="sans-serif" font-size="12" fill="#070809" font-weight="700" dy="4.2">✓ kept</text></g><line x1="210.76923076923077" x2="210.76923076923077" y1="34" y2="194" fill="none" stroke="#070809" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" /><text x="0" y="214" font-family="sans-serif" font-size="13" fill="#040506">Other ways to filter</text><g><rect x="0" y="226" width="136.4" height="24" rx="12" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><text x="68.2" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#010203" dy="4.2">Alignment length</text></g><g><rect x="144.4" y="226" width="158.6" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="223.7" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#010203" dy="4.2">Matrix completeness</text></g><g><rect x="311" y="226" width="217.8" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="419.9" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#010203" dy="4.2">Parsimony-informative sites</text></g><g><rect x="0" y="260" width="106.80000000000001" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="53.400000000000006" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#010203" dy="4.2">Missing data</text></g><g><rect x="114.80000000000001" y="260" width="106.80000000000001" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="168.20000000000002" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#010203" dy="4.2">Minimum taxa</text></g><g><rect x="229.60000000000002" y="260" width="77.2" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="268.20000000000005" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#010203" dy="4.2">Taxon ID</text></g></svg>
