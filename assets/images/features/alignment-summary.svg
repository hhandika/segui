<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220"><title id="alignment-summary-title">Alignment summary</title><desc id="alignment-summary-desc">A folder of alignments produces three outputs: an alignment summary text file for the whole dataset, a locus summary CSV with one row per alignment, and a taxon summary CSV with one row per sample.</desc><g><path d="M28,72 h126 l14,14 v50 h-140 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M24,76 h126 l14,14 v50 h-140 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M20,80 h126 l14,14 v50 h-140 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M146,80 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="108" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">alignments</text><text x="90" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">DNA or amino acid</text></g><g><g><line x1="176" y1="112" x2="315.79087558148586" y2="39.232146957582714" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="322,36 313.0040363476052,36.26951431277736 316.6191371331991,43.2143131903656" fill="#040506" /></g><g><path d="M340,6 h196 l14,14 v46 h-210 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M536,6 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="445" y="32" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">Alignment summary</text><text x="445" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">Whole dataset · TXT</text></g></g><g><g><line x1="176" y1="112" x2="315.00065669121585" y2="110.09588141518883" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="322,110 313.84311548491183,106.19668105366969 313.950357198832,114.02532616984067" fill="#040506" /></g><g><path d="M340,80 h196 l14,14 v46 h-210 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M536,80 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="445" y="106" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">Locus summary</text><text x="445" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">One row per alignment · CSV</text></g></g><g><g><line x1="176" y1="112" x2="315.721903905957" y2="180.90395261115688" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="322,184 316.46317488993463,176.90467987328623 313.0002991313357,183.92662238377858" fill="#040506" /></g><g><path d="M340,154 h196 l14,14 v46 h-210 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M536,154 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="445" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">Taxon summary</text><text x="445" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">One row per sample · CSV</text></g></g></svg>
