<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 104"><title id="contig-summary-title">Contig summary</title><desc id="contig-summary-desc">FASTA contig files, plain or gzip-compressed, produce a contig summary table with contig counts and lengths, N50, N75, N90, and GC content.</desc><g><g><path d="M18,10 h126 l14,14 v50 h-140 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M14,14 h126 l14,14 v50 h-140 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M10,18 h126 l14,14 v50 h-140 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M136,18 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="80" y="46" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">sample.fasta</text><text x="80" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">FASTA contigs</text></g><g><line x1="164" y1="50" x2="215" y2="50" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="222,50 213.8959760788259,46.085310192998925 213.8959760788259,53.914689807001075" fill="#040506" /></g><g><path d="M236,18 h136 l14,14 v50 h-150 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M372,18 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="311" y="46" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">Contig summary</text><text x="311" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">CSV table</text></g><text x="410" y="26" font-family="sans-serif" font-size="12" fill="#010203">• Contig count and lengths</text><text x="410" y="48" font-family="sans-serif" font-size="12" fill="#010203">• N50, N75, N90</text><text x="410" y="70" font-family="sans-serif" font-size="12" fill="#010203">• GC content, base counts</text><text x="410" y="92" font-family="sans-serif" font-size="12" fill="#070809" font-weight="700">Counts of contigs ≥ 750, 1000, 1500 bp</text></g></svg>
