<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210"><title id="conversion-title">Alignment conversion</title><desc id="conversion-desc">A batch of FASTA files such as locus_1.fasta is converted to NEXUS as locus_1.nex or to relaxed PHYLIP as locus_1.phy. File names stay the same; only the format and extension change.</desc><g><path d="M38,64 h136 l14,14 v50 h-150 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M34,68 h136 l14,14 v50 h-150 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M30,72 h136 l14,14 v50 h-150 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M166,72 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="105" y="100" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">locus_1.fasta</text><text x="105" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">FASTA</text></g><g><line x1="196" y1="104" x2="323.5759451823488" y2="48.780561040475895" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="330,46 321.0077531605608,45.62650732457515 324.1177628642452,52.811702157225234" fill="#040506" /></g><g><line x1="196" y1="104" x2="323.54131718316904" y2="157.30084897207064" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="330,160 324.0321455671025,153.26318224472823 321.013191562362,160.48710789892857" fill="#040506" /></g><text x="262" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#040506">convert</text><g><path d="M350,12 h136 l14,14 v50 h-150 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M486,12 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="425" y="40" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">locus_1.nex</text><text x="425" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">NEXUS</text></g><g><path d="M350,128 h136 l14,14 v50 h-150 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M486,128 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="425" y="156" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">locus_1.phy</text><text x="425" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">Relaxed PHYLIP</text></g></svg>
