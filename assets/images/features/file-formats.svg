<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"><title id="file-formats-title">Supported file extensions</title><desc id="file-formats-desc">Alignment and sequence tasks read NEXUS (.nex, .nexus, .nxs), FASTA (.fasta, .fa, .fna, .fsa, .fas), and relaxed PHYLIP (.phy, .phylip, .ph). Genomic tasks read FASTQ reads (.fastq, .fq, .fastq.gz, .fq.gz), FASTA contigs (.fasta, .fa, .fna, .fsa, .fas, and gzipped such as .fasta.gz), MAF whole-genome alignments (.maf, .maf.gz), and BED loci for MAF conversion (.bed, .bed.gz).</desc><g><text x="0" y="22" font-family="sans-serif" font-size="15" fill="#010203" font-weight="700">Alignment and sequence tasks</text><g><text x="0" y="50" font-family="sans-serif" font-size="14" fill="#070809" font-weight="700" dy="4.9">NEXUS</text><g><rect x="170" y="38" width="50.8" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="195.4" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.nex</text></g><g><rect x="228.8" y="38" width="67.19999999999999" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="262.4" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.nexus</text></g><g><rect x="304" y="38" width="50.8" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="329.4" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.nxs</text></g></g><g><text x="0" y="84" font-family="sans-serif" font-size="14" fill="#070809" font-weight="700" dy="4.9">FASTA</text><g><rect x="170" y="72" width="67.19999999999999" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="203.6" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.fasta</text></g><g><rect x="245.2" y="72" width="42.599999999999994" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="266.5" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.fa</text></g><g><rect x="295.79999999999995" y="72" width="50.8" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="321.19999999999993" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.fna</text></g><g><rect x="354.59999999999997" y="72" width="50.8" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="379.99999999999994" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.fsa</text></g><g><rect x="413.4" y="72" width="50.8" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="438.79999999999995" y="84" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.fas</text></g></g><g><text x="0" y="118" font-family="sans-serif" font-size="14" fill="#070809" font-weight="700" dy="4.9">Relaxed PHYLIP</text><g><rect x="170" y="106" width="50.8" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="195.4" y="118" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.phy</text></g><g><rect x="228.8" y="106" width="75.39999999999999" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="266.5" y="118" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.phylip</text></g><g><rect x="312.2" y="106" width="42.599999999999994" height="24" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="333.5" y="118" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" dy="4.2">.ph</text></g></g></g><g><text x="0" y="180" font-family="sans-serif" font-size="15" fill="#010203" font-weight="700">Genomic tasks</text><g><text x="0" y="208" font-family="sans-serif" font-size="14" fill="#070809" font-weight="700" dy="4.9">Reads</text><g><rect x="17