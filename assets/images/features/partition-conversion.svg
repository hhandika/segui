<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170"><title id="partition-conversion-title">Partition conversion</title><desc id="partition-conversion-desc">A RAxML partition listing DNA, locus_1 = 1-100, locus_2 = 101-150, and locus_3 = 151-200 converts to and from a NEXUS sets block with the same charsets.</desc><g><rect x="0" y="4" width="250" height="94" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="12" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">RAxML</text><text x="12" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">DNA, locus_1 = 1-100</text><text x="12" y="68" font-family="monospace" font-size="12" fill="#010203" white-space="pre">DNA, locus_2 = 101-150</text><text x="12" y="86" font-family="monospace" font-size="12" fill="#010203" white-space="pre">DNA, locus_3 = 151-200</text></g><g><line x1="266" y1="60" x2="343" y2="60" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="350,60 341.8959760788259,56.085310192998925 341.8959760788259,63.914689807001075" fill="#040506" /></g><g><line x1="350" y1="84" x2="273" y2="84" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="266,84 274.1040239211741,87.91468980700107 274.1040239211741,80.08531019299893" fill="#040506" /></g><g><rect x="366" y="4" width="274" height="130" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="378" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">NEXUS</text><text x="378" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">begin sets;</text><text x="378" y="68" font-family="monospace" font-size="12" fill="#010203" white-space="pre">  charset locus_1 = 1-100;</text><text x="378" y="86" font-family="monospace" font-size="12" fill="#010203" white-space="pre">  charset locus_2 = 101-150;</text><text x="378" y="104" font-family="monospace" font-size="12" fill="#010203" white-space="pre">  charset locus_3 = 151-200;</text><text x="378" y="122" font-family="monospace" font-size="12" fill="#010203" white-space="pre">end;</text></g></svg>
