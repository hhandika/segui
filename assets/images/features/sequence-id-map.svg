<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 150"><title id="sequence-id-map-title">Sequence ID mapping</title><desc id="sequence-id-map-desc">Three alignments are mapped into a table of samples present in each: locus_1 has seq1, seq2, seq3; locus_2 has seq2, seq3; locus_3 has seq1, seq3, seq4. Present samples are TRUE and absent ones FALSE.</desc><g><rect x="0" y="4" width="104" height="100" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="12" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_1</text><text x="12" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq1</text><text x="12" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq2</text><text x="12" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq3</text></g><g><rect x="116" y="4" width="104" height="80" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="128" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_2</text><text x="128" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq2</text><text x="128" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq3</text></g><g><rect x="232" y="4" width="104" height="100" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="244" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_3</text><text x="244" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq1</text><text x="244" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq3</text><text x="244" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq4</text></g><g><g><line x1="362" y1="70" x2="397" y2="70" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon poi