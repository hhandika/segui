<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150"><title id="sequence-id-title">Sequence ID extraction</title><desc id="sequence-id-desc">Three alignments containing seq1, seq2, seq3; seq2, seq3; seq1, seq3, seq4 give one alphabetical list of unique IDs: seq1, seq2, seq3, seq4.</desc><g><rect x="0" y="4" width="104" height="100" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="12" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_1</text><text x="12" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq1</text><text x="12" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq2</text><text x="12" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq3</text></g><g><rect x="116" y="4" width="104" height="80" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="128" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_2</text><text x="128" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq2</text><text x="128" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq3</text></g><g><rect x="232" y="4" width="104" height="100" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="244" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_3</text><text x="244" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq1</text><text x="244" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq3</text><text x="244" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq4</text></g><g><g><line x1="362" y1="70" x2="423" y2="70" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="430,70 421.8959760788259,66.08531019299893 421.8959760788259,73.91468980700107" fill="#040506" /><text x="396" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#040506">unique</text></g><g><rect x="446" y="4" width="130" height="120" rx="8" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><text x="458" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">ID list</text><text x="458" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq1</text><text x="458" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq2</text><text x="458" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq3</text><text x="458" y="110" font-family="monospace" font-size="12" fill="#010203" white-space="pre">seq4</text></g></g></svg>
