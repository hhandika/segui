<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 140"><title id="sequence-rename-title">Sequence ID renaming</title><desc id="sequence-rename-desc">An alignment with IDs sample_1, sample_2, sample_3 and a two-column table of original and new names give the same alignment with IDs Genus_species1_V01, Genus_species2_V02, Genus_species3_V03.</desc><g><rect x="0" y="4" width="110" height="100" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="12" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_1</text><text x="12" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">sample_1</text><text x="12" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">sample_2</text><text x="12" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">sample_3</text></g><text x="124" y="70" font-family="sans-serif" font-size="20" fill="#010203" font-weight="700">+</text><g><rect x="148" y="4" width="250" height="100" rx="8" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="160" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">names.csv</text><text x="160" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">sample_1,Genus_species1_V01</text><text x="160" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">sample_2,Genus_species2_V02</text><text x="160" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">sample_3,Genus_species3_V03</text></g><g><line x1="410" y1="60" x2="457" y2="60" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="464,60 455.8959760788259,56.085310192998925 455.8959760788259,63.914689807001075" fill="#040506" /><text x="437" y="50" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#040506">rename</text></g><g><rect x="476" y="4" width="200" height="100" rx="8" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><text x="488" y="26" font-family="sans-serif" font-size="12" fill="#010203" font-weight="700">locus_1</text><text x="488" y="50" font-family="monospace" font-size="12" fill="#010203" white-space="pre">Genus_species1_V01</text><text x="488" y="70" font-family="monospace" font-size="12" fill="#010203" white-space="pre">Genus_species2_V02</text><text x="488" y="90" font-family="monospace" font-size="12" fill="#010203" white-space="pre">Genus_species3_V03</text></g></svg>
