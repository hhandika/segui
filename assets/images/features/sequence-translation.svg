<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150"><title id="sequence-translation-title">Sequence translation</title><desc id="sequence-translation-desc">The DNA sequence ATG GCT TGG AAA TAA is read three bases at a time with the standard code to give the protein M A W K followed by a stop codon.</desc><g><g><text x="72" y="19" text-anchor="end" font-family="monospace" font-size="12" fill="#010203" dy="4.2">DNA</text><g><rect x="80" y="10" width="18" height="18" rx="3" fill="#00843f" /><text x="89" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">A</text></g><g><rect x="100" y="10" width="18" height="18" rx="3" fill="#c0392b" /><text x="109" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">T</text></g><g><rect x="120" y="10" width="18" height="18" rx="3" fill="#ffc423" /><text x="129" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#3a2a00" font-weight="700" dy="3.8">G</text></g><g><rect x="140" y="10" width="18" height="18" rx="3" fill="#ffc423" /><text x="149" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#3a2a00" font-weight="700" dy="3.8">G</text></g><g><rect x="160" y="10" width="18" height="18" rx="3" fill="#2565b0" /><text x="169" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">C</text></g><g><rect x="180" y="10" width="18" height="18" rx="3" fill="#c0392b" /><text x="189" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">T</text></g><g><rect x="200" y="10" width="18" height="18" rx="3" fill="#c0392b" /><text x="209" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">T</text></g><g><rect x="220" y="10" width="18" height="18" rx="3" fill="#ffc423" /><text x="229" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#3a2a00" font-weight="700" dy="3.8">G</text></g><g><rect x="240" y="10" width="18" height="18" rx="3" fill="#ffc423" /><text x="249" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#3a2a00" font-weight="700" dy="3.8">G</text></g><g><rect x="260" y="10" width="18" height="18" rx="3" fill="#00843f" /><text x="269" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">A</text></g><g><rect x="280" y="10" width="18" height="18" rx="3" fill="#00843f" /><text x="289" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">A</text></g><g><rect x="300" y="10" width="18" height="18" rx="3" fill="#00843f" /><text x="309" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">A</text></g><g><rect x="320" y="10" width="18" height="18" rx="3" fill="#c0392b" /><text x="329" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">T</text></g><g><rect x="340" y="10" width="18" height="18" rx="3" fill="#00843f" /><text x="349" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">A</text></g><g><rect x="360" y="10" width="18" height="18" rx="3" fill="#00843f" /><text x="369" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff" font-weight="700" dy="3.8">A</text></g></g></g><g><path d="M82,36 v5 H136 v-5" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="80" y="52" width="58" height="26" rx="4" fill="#5e7a3a" /><text x="109" y="65" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff" font-weight="700" dy="4.9">M</text><text x="109" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">Met</text></g><g><path d="M142,36 v5 H196 v-5" 