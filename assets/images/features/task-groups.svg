<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356"><title id="task-groups-title">SEGUL task groups</title><desc id="task-groups-desc">Four task groups. Alignments takes aligned files or partitions and offers concatenation, conversion, distance, filtering, partition conversion, splitting, summary, trimming, and unalignment. Genomic takes FASTQ reads, FASTA contigs, or MAF whole-genome alignments and offers read and contig summaries plus MAF conversion and summary. Sequences takes aligned or unaligned files and offers addition, ID extraction, mapping, renaming, sequence extraction, filtering, removal, translation, and transposition. Trees takes Newick, NEXUS, PhyloXML, or NeXML trees and offers conversion.</desc><g><rect x="2" y="2" width="190" height="352" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="18" y="32" font-family="sans-serif" font-size="17" fill="#070809" font-weight="700">Alignments</text><text x="18" y="54" font-family="sans-serif" font-size="12" fill="#040506">Input</text><text x="18" y="72" font-family="sans-serif" font-size="12" fill="#010203">Aligned files or partitions</text><line x1="18" x2="176" y1="86" y2="86" fill="none" stroke="#040506" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" /><g><circle cx="24" cy="108" r="4" fill="#070809" /><text x="36" y="108" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Concatenation</text></g><g><circle cx="24" cy="133" r="4" fill="#070809" /><text x="36" y="133" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Conversion</text></g><g><circle cx="24" cy="158" r="4" fill="#070809" /><text x="36" y="158" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Distance</text></g><g><circle cx="24" cy="183" r="4" fill="#070809" /><text x="36" y="183" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Filtering</text></g><g><circle cx="24" cy="208" r="4" fill="#070809" /><text x="36" y="208" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Partition conversion</text></g><g><circle cx="24" cy="233" r="4" fill="#070809" /><text x="36" y="233" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Splitting</text></g><g><circle cx="24" cy="258" r="4" fill="#070809" /><text x="36" y="258" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Summary</text></g><g><circle cx="24" cy="283" r="4" fill="#070809" /><text x="36" y="283" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Trimming</text></g><g><circle cx="24" cy="308" r="4" fill="#070809" /><text x="36" y="308" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Unalignment</text></g><text x="18" y="340" font-family="monospace" font-size="12" fill="#040506">segul align …</text></g><g><rect x="204" y="2" width="190" height="352" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="220" y="32" font-family="sans-serif" font-size="17" fill="#070809" font-weight="700">Genomic</text><text x="220" y="54" font-family="sans-serif" font-size="12" fill="#040506">Input</text><text x="220" y="72" font-family="sans-serif" font-size="12" fill="#010203">Reads, contigs, or MAF</text><line x1="220" x2="378" y1="86" y2="86" fill="none" stroke="#040506" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" /><g><circle cx="226" cy="108" r="4" fill="#070809" /><text x="238" y="108" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Read summary</text></g><g><circle cx="226" cy="133" r="4" fill="#070809" /><text x="238" y="133" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Contig summary</text></g><g><circle cx="226" cy="158" r="4" fill="#070809" /><text x="238" y="158" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">MAF conversion</text></g><g><circle cx="226" cy="183" r="4" fill="#070809" /><text x="238" y="183" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">MAF summary</text></g><text x="220" y="340" font-family="monospace" font-size="12" fill="#040506">segul read|contig|maf …</text></g><g><rect x="406" y="2" width="190" height="352" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="422" y="32" font-family="sans-serif" font-size="17" fill="#070809" font-weight="700">Sequences</text><text x="422" y="54" font-family="sans-serif" font-size="12" fill="#040506">Input</text><text x="422" y="72" font-family="sans-serif" font-size="12" fill="#010203">Aligned or unaligned files</text><line x1="422" x2="580" y1="86" y2="86" fill="none" stroke="#040506" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" /><g><circle cx="428" cy="108" r="4" fill="#070809" /><text x="440" y="108" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Addition</text></g><g><circle cx="428" cy="133" r="4" fill="#070809" /><text x="440" y="133" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">ID extraction</text></g><g><circle cx="428" cy="158" r="4" fill="#070809" /><text x="440" y="158" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">ID mapping</text></g><g><circle cx="428" cy="183" r="4" fill="#070809" /><text x="440" y="183" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">ID renaming</text></g><g><circle cx="428" cy="208" r="4" fill="#070809" /><text x="440" y="208" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Extraction</text></g><g><circle cx="428" cy="233" r="4" fill="#070809" /><text x="440" y="233" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Filtering</text></g><g><circle cx="428" cy="258" r="4" fill="#070809" /><text x="440" y="258" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Removal</text></g><g><circle cx="428" cy="283" r="4" fill="#070809" /><text x="440" y="283" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Translation</text></g><g><circle cx="428" cy="308" r="4" fill="#070809" /><text x="440" y="308" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Transposition</text></g><text x="422" y="340" font-family="monospace" font-size="12" fill="#040506">segul sequence …</text></g><g><rect x="608" y="2" width="190" height="352" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="624" y="32" font-family="sans-serif" font-size="17" fill="#070809" font-weight="700">Trees</text><text x="624" y="54" font-family="sans-serif" font-size="12" fill="#040506">Input</text><text x="624" y="72" font-family="sans-serif" font-size="12" fill="#010203">Newick, NEXUS, or XML trees</text><line x1="624" x2="782" y1="86" y2="86" fill="none" stroke="#040506" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" /><g><circle cx="630" cy="108" r="4" fill="#070809" /><text x="642" y="108" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Conversion</text></g><text x="624" y="340" font-family="monospace" font-size="12" fill="#040506">segul tree …</text></g></svg>
