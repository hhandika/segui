<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 356"><title id="task-groups-title">SEGUL task groups</title><desc id="task-groups-desc">Three task groups. Alignments takes aligned files or partitions and offers concatenation, conversion, distance, filtering, partition conversion, splitting, summary, trimming, and unalignment. Genomic takes FASTQ reads, FASTA contigs, or MAF whole-genome alignments and offers read and contig summaries plus MAF conversion and summary. Sequences takes aligned or unaligned files and offers addition, ID extraction, mapping, renaming, sequence extraction, filtering, removal, translation, and transposition.</desc><g><rect x="2" y="2" width="212" height="352" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="18" y="32" font-family="sans-serif" font-size="17" fill="#070809" font-weight="700">Alignments</text><text x="18" y="54" font-family="sans-serif" font-size="12" fill="#040506">Input</text><text x="18" y="72" font-family="sans-serif" font-size="12" fill="#010203">Aligned files or partitions</text><line x1="18" x2="198" y1="86" y2="86" fill="none" stroke="#040506" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" /><g><circle cx="24" cy="108" r="4" fill="#070809" /><text x="36" y="108" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Concatenation</text></g><g><circle cx="24" cy="133" r="4" fill="#070809" /><text x="36" y="133" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Conversion</text></g><g><circle cx="24" cy="158" r="4" fill="#070809" /><text x="36" y="158" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Distance</text></g><g><circle cx="24" cy="183" r="4" fill="#070809" /><text x="36" y="183" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Filtering</text></g><g><circle cx="24" cy="208" r="4" fill="#070809" /><text x="36" y="208" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Partition conversion</text></g><g><circle cx="24" cy="233" r="4" fill="#070809" /><text x="36" y="233" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Splitting</text></g><g><circle cx="24" cy="258" r="4" fill="#070809" /><text x="36" y="258" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Summary</text></g><g><circle cx="24" cy="283" r="4" fill="#070809" /><text x="36" y="283" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Trimming</text></g><g><circle cx="24" cy="308" r="4" fill="#070809" /><text x="36" y="308" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Unalignment</text></g><text x="18" y="340" font-family="monospace" font-size="12" fill="#040506">segul align …</text></g><g><rect x="226" y="2" width="212" height="352" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="242" y="32" font-family="sans-serif" font-size="17" fill="#070809" font-weight="700">Genomic</text><text x="242" y="54" font-family="sans-serif" font-size="12" fill="#040506">Input</text><text x="242" y="72" font-family="sans-serif" font-size="12" fill="#010203">Reads, contigs, or MAF</text><line x1="242" x2="422" y1="86" y2="86" fill="none" stroke="#040506" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" /><g><circle cx="248" cy="108" r="4" fill="#070809" /><text x="260" y="108" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Sequence read summary</text></g><g><circle cx="248" cy="133" r="4" fill="#070809" /><text x="260" y="133" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Contig summary</text></g><g><circle cx="248" cy="158" r="4" fill="#070809" /><text x="260" y="158" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">MAF conversion</text></g><g><circle cx="248" cy="183" r="4" fill="#070809" /><text x="260" y="183" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">MAF summary</text></g><text x="242" y="340" font-family="monospace" font-size="12" fill="#040506">segul read|contig|maf …</text></g><g><rect x="450" y="2" width="212" height="352" rx="12" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><text x="466" y="32" font-family="sans-serif" font-size="17" fill="#070809" font-weight="700">Sequences</text><text x="466" y="54" font-family="sans-serif" font-size="12" fill="#040506">Input</text><text x="466" y="72" font-family="sans-serif" font-size="12" fill="#010203">Aligned or unaligned files</text><line x1="466" x2="646" y1="86" y2="86" fill="none" stroke="#040506" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" /><g><circle cx="472" cy="108" r="4" fill="#070809" /><text x="484" y="108" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Addition</text></g><g><circle cx="472" cy="133" r="4" fill="#070809" /><text x="484" y="133" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">ID extraction</text></g><g><circle cx="472" cy="158" r="4" fill="#070809" /><text x="484" y="158" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">ID mapping</text></g><g><circle cx="472" cy="183" r="4" fill="#070809" /><text x="484" y="183" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">ID renaming</text></g><g><circle cx="472" cy="208" r="4" fill="#070809" /><text x="484" y="208" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Extraction</text></g><g><circle cx="472" cy="233" r="4" fill="#070809" /><text x="484" y="233" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Filtering</text></g><g><circle cx="472" cy="258" r="4" fill="#070809" /><text x="484" y="258" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Removal</text></g><g><circle cx="472" cy="283" r="4" fill="#070809" /><text x="484" y="283" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Translation</text></g><g><circle cx="472" cy="308" r="4" fill="#070809" /><text x="484" y="308" font-family="sans-serif" font-size="14" fill="#010203" dy="4.9">Transposition</text></g><text x="466" y="340" font-family="monospace" font-size="12" fill="#040506">segul sequence …</text></g></svg>
