<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210"><title id="tree-conversion-title">Tree conversion</title><desc id="tree-conversion-desc">A Newick tree file, species.nwk, holding the tree ((A,B),C) is converted to NEXUS as species.nex or to PhyloXML as species.phyloxml. File names stay the same; only the format and extension change.</desc><path d="M70,24 H96 M70,24 V44 M70,44 H96 M58,34 H70 M58,34 V60 M58,60 H96 M46,47 H58" fill="none" stroke="#070809" stroke-width="2" stroke-linecap="round" /><text x="104" y="28" font-family="monospace" font-size="12" fill="#010203">A</text><text x="104" y="48" font-family="monospace" font-size="12" fill="#010203">B</text><text x="104" y="64" font-family="monospace" font-size="12" fill="#010203">C</text><g><path d="M38,88 h136 l14,14 v50 h-150 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M34,92 h136 l14,14 v50 h-150 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M30,96 h136 l14,14 v50 h-150 Z" fill="#0d0e0f" stroke="#101112" stroke-width="1.5" /><path d="M166,96 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="105" y="124" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">species.nwk</text><text x="105" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">((A,B),C);</text></g><g><line x1="196" y1="128" x2="323.8337495371207" y2="59.31320920393515" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="330,56 321.00833892082403,56.38733840144219 324.7141064348546,63.28418349699914" fill="#040506" /></g><g><line x1="196" y1="128" x2="323.2924669061912" y2="165.99775131528094" fill="none" stroke="#040506" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="330,168 323.35431055326535,161.93083104720594 321.11482983407933,169.43309145647905" fill="#040506" /></g><text x="262" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#040506">convert</text><g><path d="M350,22 h136 l14,14 v50 h-150 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M486,22 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="425" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">species.nex</text><text x="425" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">NEXUS</text></g><g><path d="M350,136 h136 l14,14 v50 h-150 Z" fill="#0a0b0c" stroke="#070809" stroke-width="1.5" /><path d="M486,136 v14 h14" fill="none" stroke="#040506" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="425" y="164" text-anchor="middle" font-family="monospace" font-size="12" fill="#010203" font-weight="700">species.phyloxml</text><text x="425" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#040506">PhyloXML</text></g></svg>
