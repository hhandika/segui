[package]
name = "rust_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1"
chrono = "0.4.*"
flate2 = "1"
flutter_rust_bridge = "=2.13.0"
fs4 = "1"
log = "0.*"
rayon = "1"
log4rs = "1.4"
polars = { version = "0.55", features = ["lazy", "csv"] }
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = "1"
# SEGUL library. Plotting and PDF export are left out; the app draws its own charts.
segul-core = { version = "0.25.0", default-features = false, features = [
    "align",
    "sequence",
    "read",
    "contig",
    "maf",
    "download",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# SEGUL main until a segul-core release has the read quality checks and downloader.
[patch.crates-io]
segul-core = { git = "https://github.com/hhandika/segul", branch = "main" }
