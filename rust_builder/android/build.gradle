// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.rust_builder'
version '1.0'

apply plugin: 'com.android.library'

// Use the app's AGP classpath, SDK and NDK for the Rust build as well.
def appAndroid = project(':app').extensions.getByName('android')

android {
    namespace 'com.flutter_rust_bridge.rust_builder'
    compileSdkVersion appAndroid.compileSdkVersion
    ndkVersion appAndroid.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion appAndroid.defaultConfig.minSdkVersion.apiLevel
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust"
    libname = "rust_lib"
}
