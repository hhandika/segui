name: segui
base: core22 # the base snap is the execution environment for this snap
# The version comes from pubspec.yaml, set in the segui part below.
adopt-info: segui
summary: A phylogenomic data manipulation and summary statistic tool # 79 char long summary
description: |
  SEGUI (SEGUL GUI) is an ultrafast, memory efficient, 
  cross-platform tool for phylogenomic data manipulation and summary statistics calculation. 
  We develop SEGUL to address the need for a high-performance and accessible phylogenomic tool. 
  It is particularly well-suited for large-scale phylogenomic projects, 
  especially those involving thousands of loci and hundreds of samples. 
  Additionally, SEGUL is capable of handling small Sanger sequences effectively.

grade: stable
confinement: strict
# Each architecture builds natively, so Launchpad or remote-build needs a host for each.
architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [arm64]
    build-for: [arm64]

slots:
  dbus-segui:
    interface: dbus
    bus: session
    name: com.hhandika.segui

apps:
  segui:
    command: segui
    plugs:
      - network
      - home
      - removable-media
      - cifs-mount
    slots:
      - dbus-segui
    extensions: [gnome]

parts:
  segui:
    source: .
    build-packages:
      - curl
    plugin: flutter
    flutter-target: lib/main.dart
    # Use the pubspec version without the build number, e.g. 1.2.0.
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
    # The native assets build hook needs rustup to build the Rust crate.
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      export PATH="$HOME/.cargo/bin:$PATH"
      (cd rust && rustup toolchain install)
      craftctl default
